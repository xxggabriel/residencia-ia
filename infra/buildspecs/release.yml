# Release stage: write releases/<sha>/release.json once (Git SHA, images by digest, job
# definition revisions, control Lambda version) and move releases/latest.json to it.
version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
  build:
    commands:
      - test -n "$GIT_SHA"
      - >-
        python scripts/aws/write_release.py --stack "$RUNTIME_STACK" --bucket "$DATA_BUCKET"
        --git-sha "$GIT_SHA" --build-output "$CODEBUILD_SRC_DIR_BuildOutput/build-output.json"
        --pipeline-execution-id "${PIPELINE_EXECUTION_ID:-}"
