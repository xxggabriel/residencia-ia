AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Execution: private EC2 Spot benchmark workers and AWS Batch on Fargate for preparation
  and historical releases, the acquisition CodeBuild project (outside the VPC), the
  versioned control Lambda and the two manual Standard state machines.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Project:
    Type: String
  DataBucketName:
    Type: String
  DataBucketArn:
    Type: String
  ArtifactsBucketName:
    Type: String
  DataKeyArn:
    Type: String
  RuntimeRepositoryArn:
    Type: String
  MlRepositoryArn:
    Type: String
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  WorkerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  S3GatewayEndpointId:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  EndpointSubnets:
    Type: String
  EndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EnableStreaming:
    Type: String
    AllowedValues: ["true", "false"]
  EnableFeatureStore:
    Type: String
    AllowedValues: ["true", "false"]
  RuntimeImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$"
    Description: Runtime image pinned by digest (benchmark, preparation, acquisition).
  MlImage:
    Type: String
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$"
  GitSha:
    Type: String
    AllowedPattern: "^[0-9a-f]{40}$"
  ControlCodeKey:
    Type: String
  ControlCodeSha256:
    Type: String
    Description: Base64 SHA-256 of the control Lambda zip; a change publishes a new version.
  MaxVcpus:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 256
  FargateCapacity:
    Type: String
    Default: FARGATE
    AllowedValues: [FARGATE, FARGATE_SPOT]
  BenchmarkVcpus:
    Type: String
    Default: "1"
    AllowedValues: ["0.25", "0.5", "1", "2", "4", "8", "16"]
  BenchmarkMemoryMiB:
    Type: Number
    Default: 2048
  BenchmarkEphemeralGiB:
    Type: Number
    Default: 50
    MinValue: 21
    MaxValue: 200
  BenchmarkSpotDiskGiB:
    Type: Number
    Default: 50
    MinValue: 30
    MaxValue: 200
  BenchmarkTimeoutSeconds:
    Type: Number
    Default: 14400
    MinValue: 900
  PrepareVcpus:
    Type: String
    Default: "2"
    AllowedValues: ["1", "2", "4", "8", "16"]
  PrepareMemoryMiB:
    Type: Number
    Default: 8192
  PrepareEphemeralGiB:
    Type: Number
    Default: 150
    MinValue: 21
    MaxValue: 200
  PrepareTimeoutSeconds:
    Type: Number
    Default: 14400
    MinValue: 900
  QueueWaitTimeoutSeconds:
    Type: Number
    Default: 3600
    MinValue: 600
    MaxValue: 86400
  JobAttempts:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90, 180, 365, 731]
  ReuseRuntimeLogGroups:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ReuseBenchmarkSpotLogGroup:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AcquisitionComputeType:
    Type: String
    Default: BUILD_GENERAL1_LARGE
    AllowedValues: [BUILD_GENERAL1_MEDIUM, BUILD_GENERAL1_LARGE, BUILD_GENERAL1_XLARGE]
  AcquisitionTimeoutMinutes:
    Type: Number
    Default: 480
    MinValue: 30
    MaxValue: 2160
  EnableModelRegistry:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  EnableMlflowTracking:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  ModelRegistry: !Equals [!Ref EnableModelRegistry, "true"]
  MlflowTracking: !Equals [!Ref EnableMlflowTracking, "true"]
  Spot: !Equals [!Ref FargateCapacity, FARGATE_SPOT]
  CreateRuntimeLogGroups: !Equals [!Ref ReuseRuntimeLogGroups, "false"]

Resources:
  SpotBenchmark:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: spot.yaml
      Parameters:
        Project: !Ref Project
        DataBucketArn: !Ref DataBucketArn
        DataKeyArn: !Ref DataKeyArn
        S3GatewayEndpointId: !Ref S3GatewayEndpointId
        RuntimeRepositoryArn: !Ref RuntimeRepositoryArn
        MlRepositoryArn: !Ref MlRepositoryArn
        EnableModelRegistry: !Ref EnableModelRegistry
        LogRetentionDays: !Ref LogRetentionDays
        ReuseWorkerLogs: !Ref ReuseBenchmarkSpotLogGroup
        WorkerDiskGiB: !Ref BenchmarkSpotDiskGiB
      Tags: [{Key: cb-stack, Value: !Ref Project}, {Key: cb-component, Value: benchmark-spot}]

  JobLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateRuntimeLogGroups
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${Project}/batch"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref DataKeyArn

  ControlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Project}/control"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref DataKeyArn

  StatesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Project}/states"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref DataKeyArn

  AcquisitionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateRuntimeLogGroups
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${Project}/acquisition"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref DataKeyArn

  # ---------------------------------------------------------------- roles (one per actor)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-task-execution"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: pull-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: [!Ref RuntimeRepositoryArn]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/batch:log-stream:*"

  BenchmarkJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-benchmark-job"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: read-snapshots-write-runs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadVerifiedSnapshotsAndUnits
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub "${DataBucketArn}/datasets/*/manifests/*"
                  - !Sub "${DataBucketArn}/datasets/*/prepared/*"
                  - !Sub "${DataBucketArn}/datasets/matrix/*"
                  - !Sub "${DataBucketArn}/campaigns/*/units/*"
                  - !Sub "${DataBucketArn}/campaigns/*/runs/*"
                  - !Sub "${DataBucketArn}/mlflow/*"
                Condition: {StringEquals: {aws:SourceVpce: !Ref S3GatewayEndpointId}}
              - Sid: WriteRunEvidence
                Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource:
                  - !Sub "${DataBucketArn}/campaigns/*/runs/*"
                  - !Sub "${DataBucketArn}/analytics/runs/*"
                  - !Sub "${DataBucketArn}/analytics/metrics/*"
                  - !Sub "${DataBucketArn}/analytics/windows/*"
                  - !Sub "${DataBucketArn}/analytics/model_versions/*"
                  - !Sub "${DataBucketArn}/mlflow/*"
                Condition: {StringEquals: {aws:SourceVpce: !Ref S3GatewayEndpointId}}
              - Sid: ListForAccurateNotFound
                # Without ListBucket, HeadObject on an absent key answers 403 instead of 404, and
                # the conditional-publication checks (final manifest, snapshot marker) need 404.
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref DataBucketArn
                Condition: {StringEquals: {aws:SourceVpce: !Ref S3GatewayEndpointId}}
              - Sid: BucketKeyThroughS3
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn
                Condition: {StringEquals: {kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"}}
        - PolicyName: sagemaker-experiments
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TrackSageMakerExperiments
                Effect: Allow
                Action:
                  - sagemaker:CreateExperiment
                  - sagemaker:DescribeExperiment
                  - sagemaker:UpdateExperiment
                  - sagemaker:CreateTrial
                  - sagemaker:DescribeTrial
                  - sagemaker:UpdateTrial
                  - sagemaker:CreateTrialComponent
                  - sagemaker:DescribeTrialComponent
                  - sagemaker:UpdateTrialComponent
                  - sagemaker:AssociateTrialComponent
                  - sagemaker:BatchPutMetrics
                  - sagemaker:AddTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:experiment/${Project}-*"
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:experiment-trial/${Project}-*"
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:experiment-trial-component/${Project}-*"
              - Sid: TrackSageMakerMlflow
                Effect: Allow
                Action:
                  - sagemaker:CallMlflowAppApi
                  - sagemaker:DescribeMlflowApp
                  - sagemaker:ListMlflowApps
                  - sagemaker:CreatePresignedMlflowAppUrl
                  - sagemaker:DescribeMlflowTrackingServer
                  - sagemaker:ListMlflowTrackingServers
                  - sagemaker-mlflow:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:mlflow-app/*"
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:mlflow-tracking-server/*"
        - !If
          - ModelRegistry
          - PolicyName: register-candidates
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ManageProjectGroups
                  Effect: Allow
                  Action: [sagemaker:DescribeModelPackageGroup, sagemaker:CreateModelPackageGroup, sagemaker:AddTags]
                  Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package-group/${Project}-*"
                - Sid: ListAndRegisterVersionsInProjectGroups
                  # ListModelPackages and CreateModelPackage are authorized against the versions'
                  # ARN (model-package/<group>/*), not the group's, so both forms are granted.
                  Effect: Allow
                  Action: [sagemaker:ListModelPackages, sagemaker:CreateModelPackage, sagemaker:DescribeModelPackage]
                  Resource:
                    - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package-group/${Project}-*"
                    - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package/${Project}-*"
                - Sid: ReadModelArchiveForRegistration
                  # SageMaker validates ModelDataUrl on behalf of the caller outside the worker VPC.
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "${DataBucketArn}/campaigns/*/runs/*/attempts/*/model/model.tar.gz"
                  Condition: {StringEquals: {aws:CalledViaFirst: sagemaker.amazonaws.com}}
                - Sid: ReadInferenceImageForRegistration
                  Effect: Allow
                  Action: [ecr:BatchGetImage, ecr:DescribeImages]
                  Resource: !Ref MlRepositoryArn
          - !Ref AWS::NoValue

  PrepareJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-prepare-job"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: raw-to-prepared
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: [!Sub "${DataBucketArn}/datasets/*/raw/*", !Sub "${DataBucketArn}/datasets/*/prepared/*"]
                Condition: {StringEquals: {aws:SourceVpce: !Ref S3GatewayEndpointId}}
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "${DataBucketArn}/datasets/*/prepared/*"
                Condition: {StringEquals: {aws:SourceVpce: !Ref S3GatewayEndpointId}}
              - Sid: ListForAccurateNotFound
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref DataBucketArn
                Condition: {StringEquals: {aws:SourceVpce: !Ref S3GatewayEndpointId}}
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn
                Condition: {StringEquals: {kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"}}

  AcquisitionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-acquisition"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: raw-acquisition
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "${DataBucketArn}/datasets/*/raw/*"
              - Sid: ListForAccurateNotFound
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref DataBucketArn
              - Sid: ImportFromApprovedPrefixesOnly
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucketArn}/imports/*"
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Ref RuntimeRepositoryArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/acquisition:log-stream:*"

  ControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-control"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: control-plane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ControlLogGroup.Arn}:*"
              - Sid: ReadReleasesAndSnapshots
                # analytics/* is read back when a write-once row already exists (retries and
                # repeated RecordAttempt calls compare the stored row instead of failing).
                Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub "${DataBucketArn}/releases/*"
                  - !Sub "${DataBucketArn}/datasets/*"
                  - !Sub "${DataBucketArn}/campaigns/*"
                  - !Sub "${DataBucketArn}/analytics/*"
              - Sid: WriteCampaignStateManifestsAndAnalytics
                Effect: Allow
                Action: [s3:PutObject]
                Resource:
                  - !Sub "${DataBucketArn}/campaigns/*"
                  - !Sub "${DataBucketArn}/datasets/*/manifests/*"
                  - !Sub "${DataBucketArn}/datasets/*/raw/_manifest.json"
                  - !Sub "${DataBucketArn}/analytics/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref DataBucketArn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn
              - Sid: ObserveBatch
                Effect: Allow
                Action: [batch:ListJobs, batch:DescribeJobs, batch:DescribeJobQueues, batch:DescribeComputeEnvironments]
                Resource: "*"
              - Sid: TerminateOnlyThisStacksJobs
                Effect: Allow
                Action: [batch:TerminateJob, batch:CancelJob]
                Resource: !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job/*"
                Condition: {StringEquals: {aws:ResourceTag/cb-stack: !Ref Project}}
              - Sid: ObserveSpotBenchmarks
                Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeVolumes]
                Resource: "*"
              - Sid: RunFromSpotBenchmarkTemplate
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${SpotBenchmark.Outputs.LaunchTemplateId}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkerSecurityGroupId}"
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${SpotBenchmark.Outputs.LaunchTemplateId}"
              - Sid: RunInConfiguredBenchmarkSubnets
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                Condition:
                  StringEquals: {ec2:SubnetID: !Ref PrivateSubnets}
                  ArnEquals:
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${SpotBenchmark.Outputs.LaunchTemplateId}"
              - Sid: UsePrivateBenchmarkInterfaces
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  ArnEquals:
                    ec2:Vpc: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}"
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${SpotBenchmark.Outputs.LaunchTemplateId}"
                  Bool: {ec2:AssociatePublicIpAddress: "false"}
              - Sid: RunOnlyTaggedC6aLargeSpot
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${SpotBenchmark.Outputs.LaunchTemplateId}"
                  StringEquals:
                    ec2:InstanceType: c6a.large
                    ec2:InstanceMarketType: spot
                    ec2:MetadataHttpTokens: required
                    aws:RequestTag/cb-stack: !Ref Project
                    aws:RequestTag/cb-component: benchmark-spot
              - Sid: RunOnlyEncryptedTaggedBenchmarkVolumes
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  ArnEquals:
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${SpotBenchmark.Outputs.LaunchTemplateId}"
                  Bool: {ec2:Encrypted: "true"}
                  StringEquals:
                    aws:RequestTag/cb-stack: !Ref Project
                    aws:RequestTag/cb-component: benchmark-spot
              - Sid: TagOnSpotLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
                    aws:RequestTag/cb-stack: !Ref Project
                    aws:RequestTag/cb-component: benchmark-spot
              - Sid: TerminateOnlyThisStacksSpotWorkers
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/cb-stack: !Ref Project
                    aws:ResourceTag/cb-component: benchmark-spot
              - Sid: UseSpotWorkerProfile
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SpotBenchmark.Outputs.WorkerRoleArn
                Condition: {StringEquals: {iam:PassedToService: ec2.amazonaws.com}}
              - Sid: BootstrapSpotServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/spot.amazonaws.com/AWSServiceRoleForEC2Spot"
                Condition: {StringEquals: {iam:AWSServiceName: spot.amazonaws.com}}
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/*"
              - Effect: Allow
                Action: [servicequotas:GetServiceQuota, servicequotas:GetAWSDefaultServiceQuota]
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Project}-alerts"

  StatesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-states"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: orchestrate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeAnyControlVersion
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: [!GetAtt ControlFunction.Arn, !Sub "${ControlFunction.Arn}:*"]
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EndpointsFunction.Arn
              - Sid: SubmitToThisQueueOnly
                Effect: Allow
                Action: batch:SubmitJob
                Resource:
                  - !Ref JobQueue
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${Project}-benchmark:*"
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${Project}-prepare:*"
              - Sid: TagJobsOnSubmission
                Effect: Allow
                Action: batch:TagResource
                # A tagged SubmitJob also checks TagResource against the queue and job definition.
                Resource:
                  - !Ref JobQueue
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${Project}-benchmark:*"
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${Project}-prepare:*"
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job/*"
                Condition: {StringEquals: {aws:RequestTag/cb-stack: !Ref Project}}
              - Effect: Allow
                Action: batch:DescribeJobs
                Resource: "*"
              - Sid: SyncCancellationOfOwnJobs
                Effect: Allow
                Action: batch:TerminateJob
                Resource: !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job/*"
                Condition: {StringEquals: {aws:ResourceTag/cb-stack: !Ref Project}}
              - Sid: ManagedSyncRules
                Effect: Allow
                Action: [events:PutTargets, events:PutRule, events:DescribeRule]
                Resource:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForBatchJobsRule"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventForCodeBuildStartBuildRule"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule"
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:StopBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt AcquisitionProject.Arn
              - Sid: ReadDistributedMapItems
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucketArn}/campaigns/*/plan-items.json"
              - Sid: WriteDistributedMapResults
                Effect: Allow
                Action: [s3:PutObject, s3:ListMultipartUploadParts, s3:AbortMultipartUpload]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucketName}/map-results/*"
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn
              - Sid: DistributedMapChildren
                Effect: Allow
                Action: [states:StartExecution]
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-benchmark"
              - Effect: Allow
                Action: [states:DescribeExecution, states:StopExecution]
                Resource:
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-benchmark:*"
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-benchmark/*"
              - Sid: StatesLogDelivery
                Effect: Allow
                Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery,
                         logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies,
                         logs:DescribeLogGroups]
                Resource: "*"

  # ---------------------------------------------------------------- Batch on Fargate
  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: !Ref FargateCapacity
        MaxvCpus: !Ref MaxVcpus
        Subnets: !Ref PrivateSubnets
        SecurityGroupIds: [!Ref WorkerSecurityGroupId]
      Tags: {cb-stack: !Ref Project, cb-component: batch}

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub "${Project}-jobs"
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder: [{Order: 1, ComputeEnvironment: !Ref ComputeEnvironment}]
      # Bounded queue wait: jobs stuck RUNNABLE for these reasons are cancelled by Batch.
      JobStateTimeLimitActions:
        - {Action: CANCEL, State: RUNNABLE, MaxTimeSeconds: !Ref QueueWaitTimeoutSeconds,
           Reason: "MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE"}
        - {Action: CANCEL, State: RUNNABLE, MaxTimeSeconds: !Ref QueueWaitTimeoutSeconds,
           Reason: "MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT"}
        - {Action: CANCEL, State: RUNNABLE, MaxTimeSeconds: !Ref QueueWaitTimeoutSeconds,
           Reason: "CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY"}
      Tags: {cb-stack: !Ref Project}

  BenchmarkJobDefinition:
    Type: AWS::Batch::JobDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      JobDefinitionName: !Sub "${Project}-benchmark"
      ResourceRetentionPolicy: {SkipDeregisterOnUpdate: true}
      Type: container
      PlatformCapabilities: [FARGATE]
      PropagateTags: true
      Tags: {cb-stack: !Ref Project, cb-component: benchmark}
      Timeout: {AttemptDurationSeconds: !Ref BenchmarkTimeoutSeconds}
      RetryStrategy:
        Attempts: !Ref JobAttempts
        EvaluateOnExit:
          - {OnStatusReason: "ResourceInitializationError*", Action: RETRY}
          - {OnStatusReason: "CannotPullContainerError*", Action: RETRY}
          - {OnStatusReason: "Timeout waiting for network interface*", Action: RETRY}
          - {OnReason: "*", Action: EXIT}
      Parameters: {unit_uri: "s3://unset"}
      ContainerProperties:
        Image: !Ref RuntimeImage
        User: "1000"
        Command: [continual-bench, aws, run-unit, --unit-uri, "Ref::unit_uri", --workdir, /tmp/cb/run]
        JobRoleArn: !GetAtt BenchmarkJobRole.Arn
        ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
        ResourceRequirements:
          - {Type: VCPU, Value: !Ref BenchmarkVcpus}
          - {Type: MEMORY, Value: !Ref BenchmarkMemoryMiB}
        EphemeralStorage: {SizeInGiB: !Ref BenchmarkEphemeralGiB}
        NetworkConfiguration: {AssignPublicIp: DISABLED}
        FargatePlatformConfiguration: {PlatformVersion: LATEST}
        RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: X86_64}
        ReadonlyRootFilesystem: false
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !If [CreateRuntimeLogGroups, !Ref JobLogGroup, !Sub "/${Project}/batch"]
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: benchmark
        Environment:
          - {Name: BENCH_BUCKET, Value: !Ref DataBucketName}
          - {Name: BENCH_KMS_KEY_ID, Value: !Ref DataKeyArn}
          - {Name: BENCH_GIT_REVISION, Value: !Ref GitSha}
          - {Name: BENCH_IMAGE_DIGEST, Value: !Select [1, !Split ["@", !Ref RuntimeImage]]}
          - {Name: BENCH_PROJECT_ROOT, Value: /app}
          - {Name: BENCH_MODEL_REGISTRY, Value: !Ref EnableModelRegistry}
          - {Name: BENCH_INFERENCE_IMAGE, Value: !Ref MlImage}
          - {Name: MLFLOW_TRACKING_URI, Value: !If [MlflowTracking, !GetAtt MlflowApp.Arn, ""]}
          - {Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}
          - {Name: BENCH_BENCHMARK_VCPUS, Value: !Ref BenchmarkVcpus}
          - {Name: OMP_NUM_THREADS, Value: "2"}
          - {Name: OPENBLAS_NUM_THREADS, Value: "2"}
          - {Name: MKL_NUM_THREADS, Value: "2"}

  # ---------------------------------------------------------------- SageMaker MLflow App (serverless, $0/hr fixed cost)
  MlflowAppRole:
    Type: AWS::IAM::Role
    Condition: MlflowTracking
    Properties:
      RoleName: !Sub "${Project}-mlflow"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: sagemaker.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: mlflow-artifact-store
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub "${DataBucketArn}/mlflow/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Ref DataBucketArn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Ref DataKeyArn

  MlflowApp:
    Type: AWS::SageMaker::MlflowApp
    Condition: MlflowTracking
    Properties:
      Name: !Sub "${Project}-mlflow"
      ArtifactStoreUri: !Sub "s3://${DataBucketName}/mlflow"
      RoleArn: !GetAtt MlflowAppRole.Arn
      ModelRegistrationMode: AutoModelRegistrationDisabled
      Tags:
        - {Key: cb-stack, Value: !Ref Project}
        - {Key: cb-component, Value: mlflow}

  PrepareJobDefinition:
    Type: AWS::Batch::JobDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      JobDefinitionName: !Sub "${Project}-prepare"
      ResourceRetentionPolicy: {SkipDeregisterOnUpdate: true}
      Type: container
      PlatformCapabilities: [FARGATE]
      PropagateTags: true
      Tags: {cb-stack: !Ref Project, cb-component: prepare}
      Timeout: {AttemptDurationSeconds: !Ref PrepareTimeoutSeconds}
      RetryStrategy:
        Attempts: !Ref JobAttempts
        EvaluateOnExit:
          - {OnStatusReason: "ResourceInitializationError*", Action: RETRY}
          - {OnStatusReason: "CannotPullContainerError*", Action: RETRY}
          - {OnReason: "*", Action: EXIT}
      Parameters: {dataset: social, scope: smoke}
      ContainerProperties:
        Image: !Ref RuntimeImage
        User: "1000"
        Command: [continual-bench, aws, prepare, --dataset, "Ref::dataset", --scope, "Ref::scope", --workdir, /tmp]
        JobRoleArn: !GetAtt PrepareJobRole.Arn
        ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
        ResourceRequirements:
          - {Type: VCPU, Value: !Ref PrepareVcpus}
          - {Type: MEMORY, Value: !Ref PrepareMemoryMiB}
        EphemeralStorage: {SizeInGiB: !Ref PrepareEphemeralGiB}
        NetworkConfiguration: {AssignPublicIp: DISABLED}
        FargatePlatformConfiguration: {PlatformVersion: LATEST}
        RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: X86_64}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !If [CreateRuntimeLogGroups, !Ref JobLogGroup, !Sub "/${Project}/batch"]
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: prepare
        Environment:
          - {Name: BENCH_BUCKET, Value: !Ref DataBucketName}
          - {Name: BENCH_KMS_KEY_ID, Value: !Ref DataKeyArn}
          - {Name: BENCH_IMAGE_DIGEST, Value: !Select [1, !Split ["@", !Ref RuntimeImage]]}
          - {Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region}

  # ---------------------------------------------------------------- acquisition outside the VPC
  AcquisitionProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${Project}-acquisition"
      Description: Download pinned public sources over HTTPS (or import an S3 copy) into the raw prefix
      ServiceRole: !GetAtt AcquisitionRole.Arn
      EncryptionKey: !Ref DataKeyArn
      TimeoutInMinutes: !Ref AcquisitionTimeoutMinutes
      QueuedTimeoutInMinutes: 60
      ConcurrentBuildLimit: 2
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref AcquisitionComputeType
        Image: !Ref RuntimeImage
        ImagePullCredentialsType: SERVICE_ROLE
        EnvironmentVariables:
          - {Name: BENCH_BUCKET, Value: !Ref DataBucketName}
          - {Name: BENCH_KMS_KEY_ID, Value: !Ref DataKeyArn}
          - {Name: DATASET, Value: social}
          - {Name: SCOPE, Value: smoke}
          - {Name: MODE, Value: download}
          - {Name: IMPORT_URI, Value: ""}
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - mkdir -p "$CODEBUILD_SRC_DIR/acquisition"
                - |
                  set -eu
                  extra=""
                  if [ "$MODE" = "import" ]; then extra="--import-uri $IMPORT_URI"; fi
                  continual-bench aws acquire --dataset "$DATASET" --scope "$SCOPE" --mode "$MODE" \
                    --workdir "$CODEBUILD_SRC_DIR/acquisition" $extra
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !If [CreateRuntimeLogGroups, !Ref AcquisitionLogGroup, !Sub "/${Project}/acquisition"]
      Tags:
        - {Key: cb-stack, Value: !Ref Project}
        - {Key: cb-component, Value: acquisition}

  # ---------------------------------------------------------------- control plane
  ControlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-control"
      # Release-only changes can keep the same code package. Publishing still needs a config change.
      Description: !Sub "Plan, reconcile, record and observe campaigns and dataset snapshots (git ${GitSha})"
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: continual_bench.orchestration.aws_control.handler
      Code: {S3Bucket: !Ref ArtifactsBucketName, S3Key: !Ref ControlCodeKey}
      MemorySize: 1024
      Timeout: 300
      Role: !GetAtt ControlRole.Arn
      LoggingConfig: {LogGroup: !Ref ControlLogGroup, LogFormat: JSON}
      Environment:
        Variables:
          BENCH_BUCKET: !Ref DataBucketName
          BENCH_KMS_KEY_ID: !Ref DataKeyArn
          BENCH_JOB_QUEUE: !Ref JobQueue
          BENCH_SNS_TOPIC: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${Project}-alerts"
          BENCH_BENCHMARK_VCPUS: !Ref BenchmarkVcpus
          BENCH_FARGATE_SPOT: !If [Spot, "true", "false"]
          BENCH_STACK: !Ref Project
          BENCH_SPOT_SUBNETS: !Join [",", !Ref PrivateSubnets]
          BENCH_SPOT_SECURITY_GROUP_ID: !Ref WorkerSecurityGroupId
          BENCH_SPOT_LAUNCH_TEMPLATE_ID: !GetAtt SpotBenchmark.Outputs.LaunchTemplateId
          BENCH_SPOT_LAUNCH_TEMPLATE_VERSION: !GetAtt SpotBenchmark.Outputs.LaunchTemplateVersion
          BENCH_SPOT_LOG_GROUP: !GetAtt SpotBenchmark.Outputs.LogGroupName
          BENCH_MODEL_REGISTRY: !Ref EnableModelRegistry
          MLFLOW_TRACKING_URI: !If [MlflowTracking, !GetAtt MlflowApp.Arn, ""]
          BENCH_BENCHMARK_STATE_MACHINE_SUFFIX: !Sub ":${Project}-benchmark"
      Tags:
        - {Key: cb-stack, Value: !Ref Project}
        - {Key: cb-component, Value: control}

  ControlVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ControlFunction
      CodeSha256: !Ref ControlCodeSha256
      Description: !Sub "git ${GitSha}"

  EndpointsRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Limit the lifecycle Lambda to one endpoint stack and its coordination state.
        must:
          - Restrict mutating EC2 permissions to the private Batch network and tagged interface endpoints.
    Properties:
      RoleName: !Sub "${Project}-endpoints"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: interface-endpoint-lifecycle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ControlLogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DataBucketArn}/runtime/interface-endpoints.json"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref DataBucketArn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !Ref DataKeyArn
                Condition: {StringEquals: {kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"}}
              - Effect: Allow
                Action: states:DescribeExecution
                Resource:
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-benchmark:*"
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-dataset:*"
              - Effect: Allow
                Action: states:ListMapRuns
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-benchmark:*"
              - Effect: Allow
                Action: states:DescribeMapRun
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:mapRun:${Project}-benchmark/*"
              - Effect: Allow
                Action: batch:ListJobs
                Resource: "*"
              - Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:DescribeStacks,
                         cloudformation:ListStackResources, cloudformation:DeleteStack]
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-interface-endpoints/*"
              - Effect: Allow
                Action: [ec2:DescribeVpcEndpoints, ec2:DescribeVpcs, ec2:DescribeSubnets,
                         ec2:DescribeSecurityGroups, ec2:DescribeInstances]
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateVpcEndpoint
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${EndpointSecurityGroupId}"
              - Effect: Allow
                Action: ec2:CreateVpcEndpoint
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                Condition: {StringEquals: {ec2:SubnetID: !Split [",", !Ref EndpointSubnets]}}
              - Effect: Allow
                Action: ec2:CreateVpcEndpoint
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/cb-stack: !Ref Project
                    aws:RequestTag/cb-component: interface-endpoints
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*"
                Condition: {StringEquals: {ec2:CreateAction: CreateVpcEndpoint}}
              - Effect: Allow
                Action: ec2:DeleteVpcEndpoints
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/cb-stack: !Ref Project
                    aws:ResourceTag/cb-component: interface-endpoints

  EndpointsFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Make private Batch networking available on demand without recreating MLflow or Studio.
        must:
          - Keep the mutex expiry longer than the function timeout.
          - Invoke this function before submitting jobs on the private Batch queue.
    Properties:
      FunctionName: !Sub "${Project}-endpoints"
      Runtime: python3.12
      Handler: continual_bench.orchestration.aws_endpoints.handler
      Code: {S3Bucket: !Ref ArtifactsBucketName, S3Key: !Ref ControlCodeKey}
      Timeout: 60
      Role: !GetAtt EndpointsRole.Arn
      LoggingConfig: {LogGroup: !Ref ControlLogGroup, LogFormat: JSON}
      Environment:
        Variables:
          ENDPOINT_STATE_BUCKET: !Ref DataBucketName
          ENDPOINT_STATE_KMS_KEY: !Ref DataKeyArn
          ENDPOINT_JOB_QUEUE: !Ref JobQueue
          BENCH_STACK: !Ref Project
          ENDPOINT_BENCHMARK_WORKFLOW: !Sub "${Project}-benchmark"
          ENDPOINT_STACK_NAME: !Sub "${Project}-interface-endpoints"
          ENDPOINT_PARAMETERS: !Sub >-
            {"Project":"${Project}","VpcId":"${VpcId}","EndpointSubnets":"${EndpointSubnets}",
            "EndpointSecurityGroupId":"${EndpointSecurityGroupId}","EnableModelRegistry":"${EnableModelRegistry}",
            "EnableMlflowTracking":"${EnableMlflowTracking}","EnableStreaming":"${EnableStreaming}",
            "EnableFeatureStore":"${EnableFeatureStore}","EnableKmsAndSecretsEndpoints":"false"}
      Tags:
        - {Key: cb-stack, Value: !Ref Project}
        - {Key: cb-component, Value: interface-endpoints}

  EndpointsCleanup:
    Type: AWS::Events::Rule
    Metadata:
      com.aws.cloudformation.Context:
        why: Recheck idleness after normal exits, failures and aborts, including missed events.
        must:
          - Only the cleanup function may remove the endpoint stack after checking workflows and the queue.
    Properties:
      Description: Remove idle interface endpoints, including after failed or stopped executions.
      ScheduleExpression: rate(5 minutes)
      Targets:
        - {Id: cleanup, Arn: !GetAtt EndpointsFunction.Arn, Input: "{}"}

  EndpointsCleanupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EndpointsFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EndpointsCleanup.Arn

  BenchmarkStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${Project}-benchmark"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StatesRole.Arn
      DefinitionS3Location: ../../statemachines/benchmark.asl.json
      DefinitionSubstitutions:
        ControlFunction: !Ref ControlVersion
        EndpointsFunction: !GetAtt EndpointsFunction.Arn
        JobQueue: !Ref JobQueue
        Project: !Ref Project
        MapResultsBucket: !Ref ArtifactsBucketName
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations: [{CloudWatchLogsLogGroup: {LogGroupArn: !GetAtt StatesLogGroup.Arn}}]
      Tags:
        - {Key: cb-stack, Value: !Ref Project}

  DatasetStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${Project}-dataset"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StatesRole.Arn
      DefinitionS3Location: ../../statemachines/dataset.asl.json
      DefinitionSubstitutions:
        ControlFunction: !Ref ControlVersion
        EndpointsFunction: !GetAtt EndpointsFunction.Arn
        JobQueue: !Ref JobQueue
        AcquisitionProject: !Ref AcquisitionProject
        Project: !Ref Project
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations: [{CloudWatchLogsLogGroup: {LogGroupArn: !GetAtt StatesLogGroup.Arn}}]
      Tags:
        - {Key: cb-stack, Value: !Ref Project}

Outputs:
  DataKeyArn:
    Value: !Ref DataKeyArn
  JobQueueArn:
    Value: !Ref JobQueue
  BenchmarkJobDefinitionArn:
    Description: Legacy revision-qualified Fargate definition for historical releases
    Value: !Ref BenchmarkJobDefinition
  BenchmarkComputeBackend:
    Value: ec2-spot-c6a.large
  BenchmarkSpotLogGroupName:
    Value: !GetAtt SpotBenchmark.Outputs.LogGroupName
  PrepareJobDefinitionArn:
    Value: !Ref PrepareJobDefinition
  ControlFunctionName:
    Value: !Ref ControlFunction
  ControlFunctionArn:
    Value: !GetAtt ControlFunction.Arn
  ControlFunctionVersionArn:
    Value: !Ref ControlVersion
  BenchmarkStateMachineArn:
    Value: !Ref BenchmarkStateMachine
  DatasetStateMachineArn:
    Value: !Ref DatasetStateMachine
  BenchmarkStateMachineName:
    Value: !GetAtt BenchmarkStateMachine.Name
  DatasetStateMachineName:
    Value: !GetAtt DatasetStateMachine.Name
  AcquisitionProjectName:
    Value: !Ref AcquisitionProject
  JobLogGroupName:
    Value: !If [CreateRuntimeLogGroups, !Ref JobLogGroup, !Sub "/${Project}/batch"]
  ComputeEnvironmentArn:
    Value: !Ref ComputeEnvironment
  MlflowAppArn:
    Value: !If [MlflowTracking, !GetAtt MlflowApp.Arn, ""]
