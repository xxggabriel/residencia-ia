AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Observability: SNS alerts, EventBridge rules that send Batch job and Step Functions execution
  state changes to the control Lambda (record, alert, reconcile; never start campaigns),
  CloudWatch alarms on EMF and service metrics, and an operations dashboard.

Parameters:
  Project:
    Type: String
  DataKeyArn:
    Type: String
  ControlFunctionVersionArn:
    Type: String
  ControlFunctionName:
    Type: String
  JobQueueArn:
    Type: String
  BenchmarkStateMachineArn:
    Type: String
  DatasetStateMachineArn:
    Type: String
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to alerts (confirm the subscription email).

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${Project}-alerts"
      KmsMasterKeyId: !Ref DataKeyArn
      Tags: [{Key: cb-stack, Value: !Ref Project}]

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AlarmsAndCostServices
            Effect: Allow
            Principal: {Service: [cloudwatch.amazonaws.com, budgets.amazonaws.com, costalerts.amazonaws.com]}
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  BatchJobStateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Project}-batch-job-state"
      Description: Record and alert on job lifecycle changes of this stack's queue
      EventPattern:
        source: [aws.batch]
        detail-type: [Batch Job State Change]
        detail:
          jobQueue: [!Ref JobQueueArn]
          status: [RUNNABLE, STARTING, RUNNING, SUCCEEDED, FAILED]
      Targets:
        - Id: control
          Arn: !Ref ControlFunctionVersionArn
          RetryPolicy: {MaximumRetryAttempts: 8, MaximumEventAgeInSeconds: 3600}

  ExecutionStateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Project}-execution-state"
      Description: Reconcile campaign jobs after aborted, timed-out or failed executions
      EventPattern:
        source: [aws.states]
        detail-type: [Step Functions Execution Status Change]
        detail:
          stateMachineArn: [!Ref BenchmarkStateMachineArn, !Ref DatasetStateMachineArn]
          status: [FAILED, TIMED_OUT, ABORTED]
      Targets:
        - Id: control
          Arn: !Ref ControlFunctionVersionArn
          RetryPolicy: {MaximumRetryAttempts: 8, MaximumEventAgeInSeconds: 3600}

  BatchRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunctionVersionArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BatchJobStateRule.Arn

  ExecutionRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunctionVersionArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExecutionStateRule.Arn

  RunFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-run-failures"
      AlarmDescription: Any benchmark run returned a nonzero exit code (EMF RunFailed, Metrics Insights)
      Metrics:
        - Id: failures
          Expression: 'SELECT SUM(RunFailed) FROM SCHEMA(ContinualBench, Dataset, Policy, "Scope")'
          Period: 300
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  BenchmarkExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-benchmark-executions-failed"
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{Name: StateMachineArn, Value: !Ref BenchmarkStateMachineArn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  BenchmarkExecutionsTimedOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-benchmark-executions-timed-out"
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions: [{Name: StateMachineArn, Value: !Ref BenchmarkStateMachineArn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  DatasetExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-dataset-executions-failed"
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{Name: StateMachineArn, Value: !Ref DatasetStateMachineArn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ControlErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-control-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ControlFunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${Project}-operations"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Runs (EMF)", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [
              [{"expression": "SEARCH('{ContinualBench,Dataset,Policy,Scope} MetricName=\"RunSucceeded\"', 'Sum', 300)", "id": "ok"}],
              [{"expression": "SEARCH('{ContinualBench,Dataset,Policy,Scope} MetricName=\"RunFailed\"', 'Sum', 300)", "id": "failed"}]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Evaluation seconds (EMF)", "region": "${AWS::Region}", "stat": "Maximum", "period": 300,
            "metrics": [[{"expression": "SEARCH('{ContinualBench,Dataset,Policy,Scope} MetricName=\"EvaluationSeconds\"', 'Maximum', 300)", "id": "seconds"}]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Benchmark executions", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [
              ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${BenchmarkStateMachineArn}"],
              [".", "ExecutionsSucceeded", ".", "."], [".", "ExecutionsFailed", ".", "."],
              [".", "ExecutionsAborted", ".", "."], [".", "ExecutionsTimedOut", ".", "."]]}},
          {"type": "log", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Failed runs", "region": "${AWS::Region}",
            "query": "SOURCE '/${Project}/batch' | filter level = 'ERROR' | fields @timestamp, campaign_id, run_id, job_id, message | sort @timestamp desc | limit 50"}}]}

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
