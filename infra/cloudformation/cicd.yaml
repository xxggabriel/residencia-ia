AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  continual-bench CI/CD for GitHub Actions: an OIDC identity provider and one deploy role that
  only workflow runs in the "production" environment (restricted to the main branch in GitHub) can assume, plus the
  CloudFormation execution role used to apply the runtime change set. Replaces the former
  CodePipeline/CodeBuild pipeline. Workflows never download datasets or start campaigns.

Parameters:
  Project:
    Type: String
    Default: continual-bench
  FullRepositoryId:
    Type: String
    Description: GitHub owner/repository
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub environment name the deploy jobs run in (part of the OIDC subject).
  RuntimeStackName:
    Type: String
    Default: continual-bench-runtime
  RuntimeConfigKey:
    Type: String
    Default: config/runtime-parameters.json
    Description: Optional operator overrides (activation flags, budget, email) in the artifacts bucket.
  OidcSubjectPrefix:
    Type: String
    Default: ""
    Description: >-
      Prefix of the OIDC sub claim. Empty means "repo:<FullRepositoryId>"; repositories with immutable
      subjects use "repo:<owner>@<owner-id>/<repo>@<repo-id>" (gh api repos/<repo>/actions/oidc/customization/sub).
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com OIDC provider ARN; empty creates one (one per account).

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]
  DefaultSubjectPrefix: !Equals [!Ref OidcSubjectPrefix, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags: [{Key: cb-stack, Value: !Ref Project}]

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-gha-deploy"
      Path: !Sub "/${Project}/"
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "${Prefix}:environment:${GitHubEnvironment}"
                  - Prefix: !If [DefaultSubjectPrefix, !Sub "repo:${FullRepositoryId}", !Ref OidcSubjectPrefix]
      Policies:
        - PolicyName: build-deploy-release
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer,
                         ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                         ecr:DescribeImages]
                Resource:
                  - {"Fn::ImportValue": !Sub "${Project}-RuntimeRepositoryArn"}
                  - {"Fn::ImportValue": !Sub "${Project}-MlRepositoryArn"}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub ["${Arn}/lambda/*", {Arn: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}}]
                  - !Sub ["${Arn}/templates/*", {Arn: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}}]
                  - !Sub ["${Arn}/flink/*", {Arn: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}}]
                  - !Sub ["${Arn}/glue/*", {Arn: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}}]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ["${Arn}/${RuntimeConfigKey}", {Arn: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}}]
              - Effect: Allow
                Action: s3:ListBucket
                Resource: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ["${Arn}/releases/*", {Arn: {"Fn::ImportValue": !Sub "${Project}-DataBucketArn"}}]
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: {"Fn::ImportValue": !Sub "${Project}-DataKeyArn"}
              - Sid: ServiceSideValidation
                Effect: Allow
                Action: [states:ValidateStateMachineDefinition, cloudformation:ValidateTemplate]
                Resource: "*"
              - Sid: ResolveProjectExports
                Effect: Allow
                Action: cloudformation:ListExports
                Resource: "*"
              - Effect: Allow
                Action: [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet,
                         cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet,
                         cloudformation:DescribeStacks, cloudformation:DescribeStackEvents,
                         cloudformation:GetTemplateSummary, cloudformation:DeleteStack]
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RuntimeStackName}/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition: {StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}}
              - Effect: Allow
                Action: [batch:DescribeJobDefinitions]
                Resource: "*"

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-cfn-execution"
      Path: !Sub "/${Project}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: runtime-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ProjectRolesOnly
                Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:UpdateRole, iam:TagRole, iam:UntagRole,
                         iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:AttachRolePolicy,
                         iam:DetachRolePolicy, iam:UpdateAssumeRolePolicy, iam:ListRolePolicies,
                         iam:ListAttachedRolePolicies]
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}/${Project}-*"
              - Sid: LookupAndCleanUpRuntimeRolesByName
                # IAM can evaluate name-only calls against an ARN without the role path
                # before the new role is visible or after it is gone during rollback.
                Effect: Allow
                Action: [iam:GetRole, iam:GetRolePolicy, iam:DeleteRolePolicy, iam:DeleteRole]
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-acquisition"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-benchmark-job"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-control"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-feature-store"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-firehose"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-flink"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-glue"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-mlflow"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-prepare-job"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-sagemaker"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-states"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-task-execution"
              - Sid: PassProjectRolesToTheirServices
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}/${Project}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: [ecs-tasks.amazonaws.com, lambda.amazonaws.com, states.amazonaws.com,
                                          codebuild.amazonaws.com, firehose.amazonaws.com,
                                          kinesisanalytics.amazonaws.com, sagemaker.amazonaws.com, glue.amazonaws.com]
              - Sid: PassItselfToNestedStacks
                # The root stack creates its nested module stacks with this same service role.
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}/${Project}-cfn-execution"
                Condition: {StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}}
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName: [batch.amazonaws.com, ecs.amazonaws.com, sagemaker.amazonaws.com]
              - Sid: ManagedServicesOfTheRuntimeStack
                Effect: Allow
                Action: [ec2:*, batch:*, lambda:*, states:*, events:*, sns:*, logs:*, cloudwatch:*,
                         codebuild:*, glue:*, athena:*, kinesis:*, firehose:*, kinesisanalytics:*,
                         sagemaker:*, quicksight:*, bcm-data-exports:*, budgets:*, ce:*, cur:PutReportDefinition,
                         cur:DescribeReportDefinitions, ecs:DescribeClusters, cloudformation:*]
                Resource: "*"
                Condition: {StringEquals: {aws:RequestedRegion: us-east-1}}
              - Effect: Allow
                Action: [kms:DescribeKey, kms:CreateGrant, kms:Decrypt, kms:GenerateDataKey, kms:Encrypt]
                Resource: {"Fn::ImportValue": !Sub "${Project}-DataKeyArn"}
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub ["${Arn}/*", {Arn: {"Fn::ImportValue": !Sub "${Project}-ArtifactsBucketArn"}}]
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:GetBucketAcl, s3:GetBucketPolicy, s3:ListBucket]
                Resource:
                  - {"Fn::ImportValue": !Sub "${Project}-DataBucketArn"}
                  - {"Fn::ImportValue": !Sub "${Project}-BillingBucketArn"}

Outputs:
  GitHubActionsRoleArn:
    Description: Value of the AWS_ROLE_ARN repository variable
    Value: !GetAtt GitHubActionsRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
