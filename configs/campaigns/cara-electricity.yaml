name: cara-electricity
protocol: cara
dataset:
  name: electricity
  protocol: cara
  num_batches: 100
  offline_batches: 25
  online_batches: 75
  split_ratio: 0.9
  query_ratio: 0.1
model:
  name: random_forest
  params:
    n_estimators: 100
    n_jobs: 1
seeds: [0, 1, 2, 3, 4]
max_workers: 5
policies:
  - cara
  - cara_cumulative
  - cara_periodic
  - oracle_staleness
  - frozen
  - markov
  - adwin
  - ddm
staleness_mode: relative
# CARA paper Table 1 / Section 7.6 uses RBF kernel gamma = 20.0 for Electricity.
kernel_gamma: 20.0
