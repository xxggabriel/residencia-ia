# Docker / Homelab container stack environment (Airflow + MinIO + MLflow).
env_name: docker
platform: homelab
output_dir: s3://benchmarks
bucket: benchmarks
s3_endpoint_url: "http://minio:9000"
tracking_enabled: true
tracking_uri: "http://mlflow:5000"
experiment_prefix: ""
save_model_checkpoints: false
generate_plots: false
flush_artifacts_at_end_only: true
airflow_url: "http://airflow-api:8080"
worker_url: "http://worker:8088"
