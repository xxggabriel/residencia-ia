# Shared defaults for binary drift/retraining runs (`continual-bench run`).
# Runs extend this file and override only what differs; model and detector keep
# the engine defaults (logistic, ADWIN) unless a run declares them.
dataset:
  samples: 1200
  seed: 42
  label_delay: 3
policy:
  name: none
  action: reset_retrain
  every: 200
  cooldown: 100
  min_samples: 100
  min_window: 50
warmup: 100
replay_window: 256
metric_window: 100
checkpoint_every: 100
