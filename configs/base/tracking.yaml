# Residency tracking profile (residency-metrics-v1): metrics, shadows, references and scenario costs.
# Root base without `extends`: the Airflow DAGs read it directly as the campaign tracking profile.
version: residency-metrics-v1
adaptation_shadows: true
continual_references: true
reference_budget: null
costs:
  unit: scenario_error_units
  false_positive: 1.0
  false_negative: 39.0
  train_sample: 0.001
  update: 0.05
  train_second: 0.0
  predict_second: 0.0
  # Each execution container has 1 vCPU + 2 GiB; eight containers run one job each.
  # AWS estimate in USD; retention remains an explicit scenario assumption.
  aws:
    region: us-east-1
    price_date: "2026-11-08"
    vcpus: 1
    memory_gb: 2
    vcpu_hour_usd: 0.04048
    memory_gb_hour_usd: 0.004445
    storage_gb_month_usd: 0.023
    retention_days: 30
    billing_month_days: 30
    minimum_compute_seconds: 60
upf_alpha: 1.0
upf_alphas: [0.0, 0.1, 1.0, 10.0]
