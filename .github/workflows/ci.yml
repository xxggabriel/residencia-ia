name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is verified inside the deploy workflow
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "1"
      UV_SYSTEM_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            infra/ci-requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system --require-hashes -r requirements.lock
          uv pip install --system --no-deps -e .
          uv venv /tmp/cfn-lint
          uv pip install --python /tmp/cfn-lint/bin/python --require-hashes -r infra/ci-requirements.lock
      - run: ruff check src tests dags examples scripts
      - run: python -m pytest -q
      - name: Validate CloudFormation templates and ASL (offline)
        run: |
          CFN_LINT=/tmp/cfn-lint/bin/cfn-lint python scripts/aws/validate_templates.py
          python scripts/aws/validate_asl.py infra/statemachines/*.asl.json
      - name: Local smoke
        run: |
          continual-bench aws local-smoke --root /tmp/cb-local-smoke
          continual-bench aws local-smoke --dataset fraud --root /tmp/cb-local-fraud
          continual-bench aws local-smoke --dataset ecommerce --root /tmp/cb-local-ecommerce
