# Transient test client only: `run --rm --no-deps validation ...`; never `up`.
name: ${TASK_BENCH_PROJECT:-task-validation}
services:
  validation:
    extends:
      file: compose.yaml
      service: worker
    restart: "no"
    depends_on: !reset {}
    volumes: !override
      - ${TASK_BENCH_CODE:?required}:/work:ro
      - ${TASK_BENCH_STATE:?required}:/state
    working_dir: /work
    cpus: 2
    mem_limit: 2g
    pids_limit: 192
    healthcheck:
      disable: true
    environment:
      PYTHONPATH: /work/src
      PYTHONDONTWRITEBYTECODE: "1"
      BENCH_ZENML_PROJECT: ${TASK_BENCH_PROJECT:-task-validation}
      BENCH_ZENML_STACK: ${TASK_BENCH_PROJECT:-task-validation}
      ZENML_CONFIG_PATH: /state/zen-config
      SERVICE_TEST_STATE: /state/service-tests
networks:
  bench:
    external: true
    name: ${TASK_BENCH_NETWORK:-continual-bench_bench}
