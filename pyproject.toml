[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "continual-bench"
version = "0.1.0"
description = "Bounded, replayable continual-learning benchmark laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "river==0.26.1",
  "scikit-learn==1.9.1",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
datasets = ["Pillow==13.0.0", "pyarrow==26.0.1"]
large-datasets = [
  "duckdb==1.5.4",
  "xgboost-cpu==3.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "xgboost==3.2.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]
services = [
  "zenml==0.98.0",
  "mlflow-skinny==3.17.2",
  "boto3==1.43.117",
  "confluent-kafka==2.16.0",
  "s3fs==2026.9.0",
  "pandas==2.3.3",
  "matplotlib==3.11.2",
  "psutil==7.2.2",
]
# Keep the existing installation extra for the replication commands.
replication = []
# Detailed matplotlib figures logged with mlflow.log_figure().
plots = ["matplotlib==3.11.2"]
# SageMaker managed MLflow through the official `sagemaker-mlflow` plugin (tracking, dataset
# lineage, model registry, figures and MLflow's native async logging). The AWS image installs it
# (requirements-aws.lock); without it the workers fall back to the REST/SigV4 tracker.
aws-mlflow = [
  "boto3==1.43.117",
  "pandas==2.3.3",
  "mlflow-skinny==3.17.2",
  "sagemaker-mlflow==0.5.0",
  "matplotlib==3.11.2",
  "psutil==7.2.2",
]
# AWS managed profile: S3/Batch/SageMaker adapters and the native loader, without ZenML,
# Kafka, MinIO or Airflow (the image adds `aws-mlflow`).
aws = ["boto3==1.43.117", "pandas==2.3.3", "psutil==7.2.2"]
dev = [
    "pytest==9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.15.7",
]

[project.scripts]
continual-bench = "continual_bench.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"configs/contracts/metric-definitions.json" = "continual_bench/metric-definitions.json"
"configs/contracts/image-datasets.lock.json" = "continual_bench/image-datasets.lock.json"
"configs/contracts/real-streams.lock.json" = "continual_bench/real-streams.lock.json"
"configs/contracts/temporal-vision.lock.json" = "continual_bench/temporal-vision.lock.json"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit and contract tests",
    "integration: multi-module and local workflow integration tests",
    "e2e: end-to-end pipeline, CLI, and real-service tests",
    "services: requires actual Kafka, MinIO, MLflow and ZenML",
    "benchmark: full experiment, excluded from quick tests",
    "zia_extended_seeds: additional seeds for Zia stream integration tests, excluded from CI",
    "observation_pngs: renders benchmark observation PNG artifacts",
]
addopts = "-m 'not services and not benchmark'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
