# Dedicated worker only. Existing containers and their files remain in service.
name: semana09-dataset-benchmark
services:
  dataset-worker-1: &dataset-execution-worker
    extends:
      file: compose.yaml
      service: worker-1
    image: continual-bench-datasets:semana09-v2
    build: !reset null
    depends_on: !reset {}
    command: [python, -m, continual_bench.cli, serve-datasets]
    working_dir: /work
    restart: unless-stopped
    volumes: !override
      - ${WEEK09_CODE:?required}:/work:ro
      - ${WEEK09_STATE:?required}:/state
      - legacy-datasets:/legacy:ro
    # Inherit the standard 1-vCPU / 2-GiB limits from compose.yaml:worker-1.
    pids_limit: 256
    environment: &dataset-execution-env
      PYTHONPATH: /work/src
      BENCH_STATE: /state/binary-runs
      BENCH_EPOCH_ROOT: /state/epoch-jobs
      BENCH_DATASET_SMOKES: /state/dataset-smokes
      BENCH_DATASET_CACHE: /state/datasets
      BENCH_DATASET_DOWNLOAD: "true"
      BENCH_DATASETS: /legacy/datasets
      BENCH_ZENML_PROJECT: semana09-datasets-20261103-2341
      BENCH_ZENML_STACK: semana09-dataset-benchmark
      ZENML_CONFIG_PATH: /state/zen-config/slot-1
  dataset-worker-2:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-2
  dataset-worker-3:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-3
  dataset-worker-4:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-4
  dataset-worker-5:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-5
  dataset-worker-6:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-6
  dataset-worker-7:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-7
  dataset-worker-8:
    <<: *dataset-execution-worker
    environment:
      <<: *dataset-execution-env
      ZENML_CONFIG_PATH: /state/zen-config/slot-8
  dataset-worker:
    image: continual-bench-datasets:semana09-v2
    command: [python, -m, continual_bench.orchestration.worker_pool]
    working_dir: /work
    restart: unless-stopped
    networks: [bench]
    volumes:
      - ${WEEK09_CODE:?required}:/work:ro
    environment:
      PYTHONPATH: /work/src
      PYTHONDONTWRITEBYTECODE: "1"
      BENCH_WORKER_URLS: "http://dataset-worker-1:8088,http://dataset-worker-2:8088,http://dataset-worker-3:8088,http://dataset-worker-4:8088,http://dataset-worker-5:8088,http://dataset-worker-6:8088,http://dataset-worker-7:8088,http://dataset-worker-8:8088"
    depends_on:
      dataset-worker-1: {condition: service_healthy}
      dataset-worker-2: {condition: service_healthy}
      dataset-worker-3: {condition: service_healthy}
      dataset-worker-4: {condition: service_healthy}
      dataset-worker-5: {condition: service_healthy}
      dataset-worker-6: {condition: service_healthy}
      dataset-worker-7: {condition: service_healthy}
      dataset-worker-8: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8088/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
networks:
  bench:
    external: true
    name: continual-bench_bench
volumes:
  legacy-datasets:
    external: true
    name: continual-bench_worker-data
