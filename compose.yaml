name: continual-bench

x-common: &common
  restart: unless-stopped
  networks: [bench]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  pids_limit: 256
  security_opt: [no-new-privileges:true]

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?required}@postgres/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?required}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?required}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__PARALLELISM: "8"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

x-airflow: &airflow
  <<: *common
  build: {context: ., dockerfile: docker/airflow/Dockerfile}
  image: continual-bench-airflow:3.3.2
  environment: *airflow-env
  volumes: [airflow-logs:/opt/airflow/logs]
  mem_limit: 2g
  cpus: 2
  depends_on:
    airflow-init: {condition: service_completed_successfully}

x-worker-env: &worker-env
  PYTHONHASHSEED: "0"
  BENCH_ENV: ${BENCH_ENV:-docker}
  BENCH_SAVE_MODEL_CHECKPOINTS: ${BENCH_SAVE_MODEL_CHECKPOINTS:-false}
  BENCH_GENERATE_PLOTS: ${BENCH_GENERATE_PLOTS:-false}
  BENCH_STATE: /state/runs
  BENCH_DATASETS: /state/datasets
  # Exactly one run in each independently limited execution container.
  BENCH_CONCURRENCY: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_USER:?required}
  AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?required}
  AWS_DEFAULT_REGION: us-east-1
  BENCH_BUCKET: benchmarks
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_TRACKING_USERNAME: ${WEB_USER:?required}
  MLFLOW_TRACKING_PASSWORD: ${MLFLOW_PASSWORD:?required}

services:
  postgres:
    <<: *common
    image: postgres:17.10-bookworm
    environment: {POSTGRES_USER: airflow, POSTGRES_DB: airflow, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U airflow -d airflow]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1

  minio:
    <<: *common
    build: {context: ., dockerfile: docker/minio/Dockerfile}
    image: continual-bench-minio:2025-10-15-9e49d5e7
    command: [server, /data, --console-address, ":9001"]
    environment: {MINIO_ROOT_USER: "${MINIO_USER:?required}", MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?required}"}
    volumes: [minio-data:/data]
    ports: ["${WEB_BIND_IP:?required}:19001:9001"]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 2

  kafka:
    <<: *common
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "268435456"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null]
      interval: 15s
      timeout: 10s
      retries: 12
    mem_limit: 1536m
    cpus: 2

  mlflow:
    <<: *common
    build: {context: ., dockerfile: docker/mlflow.Dockerfile}
    image: continual-bench-mlflow:3.17.2
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1",
      --backend-store-uri, sqlite:////mlflow/tracking.db, --artifacts-destination, s3://mlflow,
      --app-name, basic-auth, --allowed-hosts, "mlflow:5000,localhost:15000,127.0.0.1:15000,${WEB_BIND_IP:?required}:15000",
      --cors-allowed-origins, "http://${WEB_BIND_IP:?required}:15000"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER:?required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?required}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_AUTH_ADMIN_USERNAME: ${WEB_USER:?required}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_PASSWORD:?required}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SECRET:?required}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes: [mlflow-data:/mlflow]
    ports: ["${WEB_BIND_IP:?required}:15000:5000"]
    depends_on:
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://mlflow:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
    mem_limit: 3g
    cpus: 4

  storage-init:
    <<: *common
    restart: "no"
    build: .
    image: continual-bench-worker:0.1.0
    environment: *worker-env
    command: [python, -c, "from continual_bench.infrastructure.services import S3Objects; s=S3Objects(); existing={b['Name'] for b in s.client.list_buckets()['Buckets']}; [s.client.create_bucket(Bucket=b) for b in ('benchmarks','mlflow') if b not in existing]"]
    depends_on:
      minio: {condition: service_healthy}
    mem_limit: 256m
    cpus: 1

  worker:
    <<: *common
    build: .
    image: continual-bench-worker:0.1.0
    command: [python, -m, continual_bench.orchestration.worker_pool]
    environment:
      BENCH_WORKER_URLS: "http://worker-1:8088,http://worker-2:8088,http://worker-3:8088,http://worker-4:8088,http://worker-5:8088,http://worker-6:8088,http://worker-7:8088,http://worker-8:8088"
    depends_on:
      worker-1: {condition: service_healthy}
      worker-2: {condition: service_healthy}
      worker-3: {condition: service_healthy}
      worker-4: {condition: service_healthy}
      worker-5: {condition: service_healthy}
      worker-6: {condition: service_healthy}
      worker-7: {condition: service_healthy}
      worker-8: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8088/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m

  worker-1: &execution-worker
    <<: *common
    build: .
    image: continual-bench-worker:0.1.0
    environment:
      <<: *worker-env
      BENCH_EVENT_SPOOL: /event-spool/events.sqlite3
      BENCH_LOG_ENVIRONMENT: ${BENCH_LOG_ENVIRONMENT:-homelab}
    volumes: [worker-data:/state, event-spool:/event-spool]
    depends_on:
      storage-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8088/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
    # Each execution owns this budget; the pool has eight independent containers.
    # Keep aligned with CostConfig.aws and configs/base/tracking.yaml.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1
    pids_limit: 768

  worker-2:
    <<: *execution-worker

  worker-3:
    <<: *execution-worker

  worker-4:
    <<: *execution-worker

  worker-5:
    <<: *execution-worker

  worker-6:
    <<: *execution-worker

  worker-7:
    <<: *execution-worker

  worker-8:
    <<: *execution-worker

  airflow-init:
    <<: *airflow
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${WEB_USER:?required}
      _AIRFLOW_WWW_USER_PASSWORD: ${WEB_PASSWORD:?required}
    command: version

  airflow-api:
    <<: *airflow
    environment:
      <<: *airflow-env
      AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: continual_bench.observability.airflow_logs.LOGGING_CONFIG
      BENCH_TASK_LOG_BACKEND: ${BENCH_TASK_LOG_BACKEND:-local}
      BENCH_GRAYLOG_URL: http://graylog:9000
      BENCH_GRAYLOG_STREAM: ${BENCH_GRAYLOG_STREAM:-}
      BENCH_GRAYLOG_TOKEN_FILE: /run/secrets/graylog-reader
      BENCH_LOG_ENVIRONMENT: ${BENCH_LOG_ENVIRONMENT:-homelab}
    secrets: [graylog-reader]
    networks: [bench, observability]
    command: api-server
    ports: ["${WEB_BIND_IP:?required}:18081:8080"]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      timeout: 10s
      retries: 12

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8974/health]
      interval: 15s
      timeout: 10s
      retries: 12

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: [CMD-SHELL, "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 15s
      retries: 12

  log-forwarder:
    profiles: ["observability"]
    image: continual-bench-worker:0.1.0
    entrypoint: [python, -m, continual_bench.observability.forward]
    environment:
      BENCH_EVENT_SPOOL: /event-spool/events.sqlite3
      BENCH_GELF_URL: http://graylog:12201/gelf
    volumes: [event-spool:/event-spool]
    networks: [observability]
    restart: unless-stopped
    mem_limit: 128m
    security_opt: [no-new-privileges:true]

  graylog-mongo:
    profiles: ["observability"]
    image: mongo:7.0.30
    volumes: [graylog-mongo:/data/db]
    networks: [graylog-storage]
    restart: unless-stopped
    mem_limit: 1g

  graylog-search:
    profiles: ["observability"]
    image: opensearchproject/opensearch:2.19.5
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
    volumes: [graylog-search:/usr/share/opensearch/data]
    networks: [graylog-storage]
    restart: unless-stopped
    mem_limit: 2g

  graylog:
    profiles: ["observability"]
    image: graylog/graylog:7.1.0
    # Compose interpolates inactive profiles, so require credentials when this service starts.
    entrypoint:
      - tini
      - --
      - /bin/sh
      - -ec
      - |
        : "$${GRAYLOG_PASSWORD_SECRET:?required}" "$${GRAYLOG_ROOT_PASSWORD_SHA2:?required}"
        exec /docker-entrypoint.sh "$$@"
      - graylog
    command: [server]
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:-}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:-}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://127.0.0.1:${GRAYLOG_UI_PORT:-19000}/
      GRAYLOG_MONGODB_URI: mongodb://graylog-mongo:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://graylog-search:9200
      GRAYLOG_SERVER_JAVA_OPTS: -Xms768m -Xmx768m -XX:+UseG1GC
      GRAYLOG_MESSAGE_JOURNAL_MAX_SIZE: 1gb
      GRAYLOG_MESSAGE_JOURNAL_MAX_AGE: 24h
    depends_on: [graylog-mongo, graylog-search]
    volumes: [graylog-data:/usr/share/graylog/data]
    ports: ["127.0.0.1:${GRAYLOG_UI_PORT:-19000}:9000"]
    networks: [observability, graylog-storage]
    restart: unless-stopped
    mem_limit: 2g

networks:
  bench: {}
  observability: {}
  graylog-storage:
    internal: true

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  mlflow-data:
  worker-data:
  airflow-logs:
  event-spool:
  graylog-mongo:
  graylog-search:
  graylog-data:

secrets:
  graylog-reader:
    file: ${BENCH_GRAYLOG_TOKEN_PATH:-/dev/null}
