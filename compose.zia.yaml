# Apply on the homelab after the standard Compose files. No training container downloads data.
services:
  worker-1:
    volumes: &zia-input
      - ${BENCH_ZIA_DATA_DIR:?required}:/zia-data:ro
    environment: &zia-runtime
      BENCH_GIT_REVISION: ${BENCH_GIT_REVISION:-uncommitted}
  worker-2:
    volumes: *zia-input
    environment: *zia-runtime
  worker-3:
    volumes: *zia-input
    environment: *zia-runtime
  worker-4:
    volumes: *zia-input
    environment: *zia-runtime
  worker-5:
    volumes: *zia-input
    environment: *zia-runtime
  worker-6:
    volumes: *zia-input
    environment: *zia-runtime
  worker-7:
    volumes: *zia-input
    environment: *zia-runtime
  worker-8:
    volumes: *zia-input
    environment: *zia-runtime
